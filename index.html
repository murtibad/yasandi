<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yaşandı</title>
  <meta name="description" content="Türkiye'de yaşanabilecek gündelik anlardan oluşan, yazarak oynanan kısa bir metin oyunu.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#0f0e0d">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Yaşandı">
  <meta property="og:title" content="Yaşandı">
  <meta property="og:description" content="Keko, otobüs teyzesi, Nebahat teyzenin bitmeyen tabağı... Türkiye'de yaşanmış anlar. Yazarak oyna, bütün sonları bul.">
  <meta property="og:url" content="https://murtibad.github.io/yasandi/">
  <meta property="og:image" content="https://murtibad.github.io/yasandi/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="tr_TR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Yaşandı">
  <meta name="twitter:description" content="Türkiye'de yaşanmış anlar. Yazarak oyna, bütün sonları bul.">
  <meta name="twitter:image" content="https://murtibad.github.io/yasandi/assets/og.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
  <script>try { var t = localStorage.getItem("yasandi.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="stylesheet" href="css/style.css?v=52">
</head>
<body>
  <div class="app">
    <header class="bar">
      <span class="brand">Yaşandı</span>
      <span class="meta">
        <span id="scenario-title"></span>
        <button class="link endings-count" id="endings-count" type="button" title="Bulduğun sonlar"></button>
      </span>
      <span class="settings">
        <button class="link btn-icon" id="toggle-sound" type="button" aria-pressed="true" aria-label="Ses açık">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="icon-sound">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07" class="sound-wave sound-wave-1"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14" class="sound-wave sound-wave-2"></path>
          </svg>
        </button>
        <button class="link btn-icon" id="toggle-theme" type="button" aria-label="Temayı değiştir">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="icon-theme">
            <g class="icon-sun">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </g>
            <g class="icon-moon">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </g>
          </svg>
        </button>
      </span>
    </header>

    <main class="log" id="log" aria-live="polite"></main>

    <div class="gallery" id="gallery" hidden>
      <div class="gallery-panel" role="dialog" aria-modal="true" aria-labelledby="gallery-title">
        <div class="gallery-head">
          <span id="gallery-title"></span>
          <button class="link" id="gallery-close" type="button">Kapat</button>
        </div>
        <ul class="gallery-list" id="gallery-list"></ul>
      </div>
    </div>

    <footer class="dock">
      <div class="end-actions" id="end-actions" hidden>
        <button class="btn" id="replay" type="button">Tekrar oyna</button>
        <button class="btn" id="next-scenario" type="button">Başka senaryo</button>
        <button class="btn" id="share" type="button">Paylaş</button>
      </div>
      <form class="prompt" id="prompt" autocomplete="off">
        <span class="prompt-mark" aria-hidden="true">››</span>
        <label for="command" class="visually-hidden" hidden>Ne yapıyorsun?</label>
        <input class="field" id="command" name="command" type="text" placeholder="ne yapıyorsun?"
               autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" maxlength="200">
        <button class="send-btn" type="submit" aria-label="Gönder" title="Gönder">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
      <p class="hint">Yaz, Enter'a bas. Takılırsan "?" yaz. <a class="link" id="story-link" href="#" target="_blank" rel="noopener" hidden>Senin de başına geldi mi? Hikâyeni anlat.</a> <span class="ver">v0.5.1 beta</span></p>
    </footer>
  </div>

  <script src="js/text.js?v=52"></script>
  <script src="js/data/global-intents.js?v=52"></script>
  <script src="js/data/scenarios/goz-temasi.js?v=52"></script>
  <script src="js/data/scenarios/otobus-teyzesi.js?v=52"></script>
  <script src="js/data/scenarios/yetersiz-bakiye.js?v=52"></script>
  <script src="js/data/scenarios/misafirlik.js?v=52"></script>
  <script src="js/data/scenarios/berber.js?v=52"></script>
  <script src="js/data/scenarios/terk-edilmis-koy.js?v=52"></script>
  <script src="js/data/scenarios/apartman-kedisi.js?v=52"></script>
  <script src="js/data/scenarios/is-gorusmesi.js?v=52"></script>
  <script src="js/data/scenarios/piknik-karincasi.js?v=52"></script>
  <script src="js/data/scenarios/saglik-raporu.js?v=52"></script>
  <script src="js/data/scenarios/tahtaya-kalk.js?v=52"></script>
  <script src="js/data/scenarios/2010-bir-gun.js?v=52"></script>
  <script src="js/sound.js?v=52"></script>
  <script src="js/engine.js?v=52"></script>
  <script src="js/main.js?v=52"></script>
</body>
</html>
